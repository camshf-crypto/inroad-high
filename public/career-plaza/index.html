<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>진로 광장 · 비커스</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--g:#10B981;--gd:#047857;--glass:rgba(30,41,36,.42);--glass2:rgba(255,255,255,.14);--line:rgba(255,255,255,.22)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#1d2a24;font-family:'Pretendard Variable',Pretendard,system-ui,sans-serif;color:#fff;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
button{font-family:inherit;border:0;background:none;color:inherit;cursor:pointer}
#stage{position:fixed;inset:0;display:flex;justify-content:center;background:#121a16}
#frame{position:relative;width:100%;height:100%;overflow:hidden}
canvas{display:block;width:100%;height:100%}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.gl{background:var(--glass);backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);border:1px solid var(--line);border-radius:999px;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.top{position:absolute;left:12px;right:12px;top:14px;display:flex;align-items:center;gap:8px;z-index:5}
.cb{width:46px;height:46px;display:flex;align-items:center;justify-content:center;flex:none}
.room{height:46px;padding:0 16px;display:flex;align-items:center;gap:6px;font-weight:700;font-size:14.5px}
.room small{font-weight:500;opacity:.75;font-size:12.5px}
.drop{position:absolute;right:12px;top:14px;display:flex;flex-direction:column;align-items:flex-end;gap:8px;z-index:5}
.stat{height:46px;padding:0 6px 0 14px;display:flex;align-items:center;gap:12px;font-weight:700;font-size:15px}
.stat span{display:flex;align-items:center;gap:6px}
.stat .dp{height:34px;padding:0 12px;border-radius:999px;background:rgba(255,255,255,.9);color:#065F46;display:flex;align-items:center;gap:5px;font-size:13.5px}
.chip{height:40px;padding:0 16px;display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:700}
.chip i{width:7px;height:7px;border-radius:50%;background:#34D399;box-shadow:0 0 0 3px rgba(52,211,153,.3);font-style:normal}
.walk{position:absolute;left:50%;bottom:112px;transform:translateX(-50%);display:none;align-items:center;gap:6px;padding:6px;z-index:5}
.walk span{padding:0 10px;font-size:14px;font-weight:600;opacity:.9}
.walk button{height:38px;padding:0 18px;border-radius:999px;background:rgba(255,255,255,.18);border:1px solid var(--line);font-weight:800;font-size:14.5px}
.tag{position:absolute;transform:translate(-50%,-100%);pointer-events:none;white-space:nowrap;z-index:3;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 10px 4px 4px;border-radius:999px;background:rgba(255,253,245,.92);color:#2B2A26;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.tag b{width:20px;height:20px;border-radius:50%;background:#6B7280;color:#fff;font-size:10.5px;display:flex;align-items:center;justify-content:center}
.tag.me b{background:#059669}
.tag.t b{background:#2563EB}
.bub{position:absolute;transform:translate(-50%,-100%);pointer-events:none;z-index:4;background:#fff;color:#1F2937;font-size:13px;font-weight:700;padding:7px 12px;border-radius:14px;box-shadow:0 4px 14px rgba(0,0,0,.2);white-space:nowrap;animation:bp .25s ease}
.bub:after{content:'';position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-top-color:#fff;border-bottom:0}
@keyframes bp{from{transform:translate(-50%,-80%) scale(.7);opacity:0}}
.sign{position:absolute;transform:translate(-50%,-100%);pointer-events:auto;cursor:pointer;z-index:2;text-align:center;white-space:nowrap}
.sign .n{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:12px;background:rgba(18,26,22,.62);backdrop-filter:blur(8px);border:1px solid var(--line);font-size:12.5px;font-weight:700}
.sign .n em{font-style:normal;font-size:11px;font-weight:600;opacity:.75}
.sign .n .k{width:18px;height:18px;border-radius:50%;background:#34D399;color:#064E3B;font-size:11px;display:flex;align-items:center;justify-content:center;font-weight:800}
.sign.cur .n{background:rgba(16,185,129,.88);border-color:rgba(255,255,255,.5)}
.sign.cur .n .k{background:#fff;color:#047857}
.sign.lock .n{opacity:.7}
.sign.lock .n .k{background:rgba(255,255,255,.25);color:#fff}
.bar{position:absolute;left:12px;right:12px;bottom:18px;display:flex;justify-content:space-around;align-items:center;padding:12px 6px;border-radius:26px;z-index:5}
.bar button{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:700;min-width:66px;padding:4px 0;border-radius:14px}
.bar button svg.i{width:26px;height:26px;stroke-width:1.5}
.bar button:active{background:rgba(255,255,255,.12)}
.sheet{position:absolute;left:12px;right:12px;bottom:110px;z-index:6;border-radius:22px;padding:16px 16px 14px;background:rgba(255,253,247,.96);color:#1F2937;box-shadow:0 12px 34px rgba(0,0,0,.28);transform:translateY(20px);opacity:0;pointer-events:none;transition:.22s}
.sheet.on{transform:none;opacity:1;pointer-events:auto}
.sheet .h{display:flex;align-items:center;gap:12px}
.sheet .ic{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.sheet .ic svg.i{width:24px;height:24px}
.sheet small{display:block;font-size:12px;color:#6B7280;font-weight:600}
.sheet b{display:block;font-size:17px;font-weight:800;margin-top:1px}
.sheet p{font-size:13.5px;color:#4B5563;line-height:1.55;margin-top:10px}
.qs{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.qs div{display:flex;align-items:center;gap:10px;border:1px solid #E5E7EB;border-radius:12px;padding:9px 12px;font-size:13.5px;font-weight:600;background:#fff}
.qs div i{width:22px;height:22px;border-radius:50%;background:#F3F4F6;font-style:normal;font-size:11.5px;font-weight:800;display:flex;align-items:center;justify-content:center;color:#6B7280;flex:none}
.qs div.d i{background:#10B981;color:#fff}
.qs div.n{border-color:#10B981;background:#ECFDF5}
.qs div em{margin-left:auto;font-style:normal;font-size:12px;color:#059669;font-weight:700}
.qs div.l{opacity:.55}
.btns{display:flex;gap:8px;margin-top:12px}
.btn{flex:1;height:46px;border-radius:14px;font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:6px}
.btn.p{background:#059669;color:#fff}.btn.p:active{background:#047857}
.btn.o{background:#F3F4F6;color:#374151}
.say{position:absolute;left:12px;right:12px;bottom:110px;z-index:6;border-radius:22px;padding:12px;display:none;flex-wrap:wrap;gap:8px}
.say.on{display:flex}
.say button{padding:9px 14px;border-radius:999px;background:rgba(255,255,255,.18);border:1px solid var(--line);font-size:13.5px;font-weight:700}
.toast{position:absolute;left:50%;top:84px;transform:translate(-50%,-10px);z-index:9;padding:10px 16px;font-size:13.5px;font-weight:700;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
.modal{position:absolute;inset:0;z-index:10;background:rgba(10,15,12,.5);display:none;align-items:flex-end}
.modal.on{display:flex}
.mbox{width:100%;max-height:86%;overflow:auto;background:#FFFDF7;color:#1F2937;border-radius:26px 26px 0 0;padding:22px 18px 26px;animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:.5}}
.mbox h3{font-size:19px;font-weight:800}.mbox .s{font-size:13.5px;color:#6B7280;margin-top:4px;line-height:1.55}
.vid{margin-top:14px;height:180px;border-radius:16px;background:#111827;color:#fff;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;font-size:13px;opacity:.95}
.vid .pl{width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center}
.grab{width:40px;height:4px;border-radius:4px;background:#D1D5DB;margin:-8px auto 14px}
.ppl{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.ppl div{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid #E5E7EB;border-radius:12px;font-size:14px;font-weight:700;background:#fff}
.ppl div span.av{width:30px;height:30px;border-radius:50%;color:#fff;font-size:12.5px;display:flex;align-items:center;justify-content:center}
.ppl div small{margin-left:auto;font-size:12px;color:#6B7280;font-weight:600}
.hint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:8;text-align:center;padding:18px 22px;border-radius:22px;font-size:14px;line-height:1.6;font-weight:600;transition:.3s}
.hint b{display:block;font-size:17px;margin-bottom:4px}
.dsign{position:absolute;transform:translate(-50%,-100%);pointer-events:none;z-index:2;white-space:nowrap;display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:14px;background:rgba(255,253,247,.94);color:#1F2937;font-size:15px;font-weight:800;box-shadow:0 4px 14px rgba(0,0,0,.15)}
.dsign span{width:12px;height:12px;border-radius:4px}.dsign em{font-style:normal;font-size:12px;color:#6B7280;font-weight:600}
.sign.dep .n{font-size:12px;padding:4px 9px 4px 4px;background:rgba(255,253,247,.92);color:#1F2937;border-color:rgba(0,0,0,.06)}
.sign.dep .n .k{width:16px;height:16px;font-size:10px}
.chips{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.chip svg.i{opacity:.9}
.dh{margin:0 -18px;padding:18px;color:#fff}.dh small{font-size:12.5px;font-weight:700;opacity:.9}.dh h3{font-size:22px;margin:2px 0 6px}.dh div{font-size:14px;line-height:1.55;opacity:.95}
.sec{margin-top:16px}.sec>b{display:flex;align-items:center;gap:6px;font-size:14.5px;font-weight:800;color:#111827}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.pills span{padding:7px 12px;border-radius:999px;background:#F3F4F6;font-size:13.5px;font-weight:700;color:#374151}
.likes{display:flex;gap:6px;margin-top:8px}.likes button{flex:1;padding:11px 4px;border-radius:12px;border:1.5px solid #E5E7EB;font-size:13.5px;font-weight:700;color:#374151;background:#fff}.likes button.on{border-color:#059669;background:#ECFDF5;color:#047857}
.fin{width:100%;margin-top:12px;padding:12px 14px;border-radius:12px;border:1.5px solid #E5E7EB;font-size:15px;font-family:inherit;outline:none}.fin:focus{border-color:#059669}
.fg{margin-top:14px}.fg>b{display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:800}.fg>b span{width:10px;height:10px;border-radius:3px}
.fg>div{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.fg button{padding:8px 12px;border-radius:10px;background:#F3F4F6;font-size:13.5px;font-weight:700;color:#374151}
.dexbar{height:10px;border-radius:99px;background:#F3F4F6;margin-top:14px;overflow:hidden}.dexbar i{display:block;height:100%;background:#10B981;border-radius:99px}
.dexrow{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:14px}.dexrow>span{width:10px;height:10px;border-radius:3px}.dexrow b{width:56px}.dexrow .mini{flex:1;height:8px;border-radius:99px;background:#F3F4F6;overflow:hidden}.dexrow .mini i{display:block;height:100%}.dexrow em{font-style:normal;font-size:12.5px;color:#6B7280;width:40px;text-align:right}
.opts2{display:flex;flex-direction:column;gap:6px;margin-top:12px}.opts2 button{padding:12px 14px;border-radius:12px;border:1.5px solid #E5E7EB;background:#fff;font-size:14.5px;font-weight:700;color:#374151;text-align:left}.opts2 button.ok{border-color:#059669;background:#ECFDF5;color:#047857}.opts2 button.no{border-color:#FCA5A5;background:#FEF2F2;color:#B91C1C}
.pmap{width:100%;margin-top:12px;display:block}.pmap .mt{font:800 9.5px Pretendard,sans-serif;fill:#1F2937;text-anchor:middle}.pmap .ms{font:700 8px Pretendard,sans-serif;fill:#4B5563;text-anchor:middle}.pmap .mi{font:800 9px Pretendard,sans-serif;fill:#fff;text-anchor:middle}.pmap .mq{font:800 7px Pretendard,sans-serif;fill:#92400E;text-anchor:middle}.pmap .ml{cursor:pointer}.pmap .ml:hover circle:first-child{stroke-width:4}
.pulse{animation:pl 1.4s ease-in-out infinite;transform-origin:center;transform-box:fill-box}@keyframes pl{50%{transform:scale(1.7);opacity:.05}}
.pk{display:flex;align-items:center;gap:10px;text-align:left;margin-top:6px;padding:10px 12px;border:1px solid #E5E7EB;border-radius:12px;background:#fff}.pk>span{width:14px;height:14px;border-radius:4px}.pk b{display:block;font-size:14.5px;color:#111827}.pk small{font-size:12.5px;color:#6B7280}
.lgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:12px}.lgrid button{display:flex;align-items:center;gap:7px;padding:11px 12px;border-radius:12px;border:1.5px solid #E5E7EB;background:#fff;font-size:14px;font-weight:700;color:#374151;text-align:left}.lgrid button span{width:11px;height:11px;border-radius:3px;flex:none}.lgrid button em{margin-left:auto;font-style:normal;font-size:11.5px;color:#6B7280}
.wtop{display:flex;gap:12px;align-items:center}.wtop #pvwrap{flex:none}.wtop canvas{width:150px;height:170px;border-radius:18px;background:linear-gradient(180deg,#ECFDF5,#F8FAFC);flex:none}.wt{flex:1}.wt h3{font-size:19px}.wdrop{margin-top:8px;display:inline-flex;gap:4px;align-items:center;padding:6px 12px;border-radius:999px;background:#ECFDF5;color:#047857;font-size:14px}
.wtabs{display:flex;gap:6px;margin-top:14px}.wtabs button{flex:1;padding:10px;border-radius:12px;background:#F3F4F6;font-size:14px;font-weight:800;color:#6B7280}.wtabs button.on{background:#059669;color:#fff}
.wgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.wi{display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:12px;border-radius:14px;border:1.5px solid #E5E7EB;background:#fff;text-align:left}
.wi .sw{width:30px;height:30px;border-radius:10px;border:1px solid rgba(0,0,0,.1);margin-bottom:4px}.wi b{font-size:14px;color:#111827}.wi small{font-size:11.5px;font-weight:700}.wi em{font-style:normal;font-size:12px;font-weight:700;color:#059669;margin-top:4px}
.wi.on{border-color:#059669;background:#ECFDF5}.wi.lk{opacity:.6}.wi.lk em{color:#6B7280}
.bar button{min-width:58px}
.skipq{width:100%;margin-top:8px;padding:10px;border-radius:12px;background:#F3F4F6;font-size:13.5px;font-weight:700;color:#4B5563}
/* PC·태블릿: 화면 전체에 3D, 버튼·카드는 가운데 적당한 폭으로 */
.bar{left:50%;right:auto;transform:translateX(-50%);width:min(560px,calc(100% - 24px))}
.sheet{left:50%;right:auto;width:min(460px,calc(100% - 24px));transform:translate(-50%,20px)}.sheet.on{transform:translate(-50%,0)}
.say{left:50%;right:auto;transform:translateX(-50%);width:min(560px,calc(100% - 24px))}
.mbox{max-width:600px;margin:0 auto}
@media (min-width:700px){.modal{align-items:center;padding:24px}.mbox{border-radius:26px;max-height:90%}.top{left:20px;top:18px}.drop{right:20px;top:18px}}
</style></head><body>
<div id="stage"><div id="frame">
  <canvas id="cv"></canvas>
  <div id="labels"></div>

  <div class="top">
    <button class="gl cb" onclick="closePlaza()"><svg class="i" viewBox="0 0 24 24"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 16l-4-4 4-4M6 12h10"/></svg></button>
    <button class="gl room" onclick="openPeople()">진로 광장 <small id="roomName">중1 A반</small><svg class="i" viewBox="0 0 24 24" style="width:15px;height:15px"><path d="m6 9 6 6 6-6"/></svg></button>
  </div>
  <div class="drop">
    <div class="gl stat"><span onclick="openPeople()" style="cursor:pointer"><svg class="i" viewBox="0 0 24 24" style="width:18px;height:18px"><circle cx="9" cy="8" r="3.5"/><path d="M2 20a7 7 0 0 1 14 0M16 4.5a3.5 3.5 0 0 1 0 7M22 20a7 7 0 0 0-4-6.3"/></svg><b id="pc">8</b></span><span onclick="toggleSnd()" style="cursor:pointer" id="snd"></span><span class="dp"><svg class="i" viewBox="0 0 24 24" style="width:15px;height:15px;stroke-width:2"><path d="M12 3s6 6.4 6 11a6 6 0 0 1-12 0c0-4.6 6-11 6-11z"/></svg><b id="drop">120</b></span></div>
    <div class="chips" id="chips"></div>
  </div>

  <div class="gl walk" id="walk"><span>걷는 중</span><button onclick="stopWalk()">멈추기</button></div>

  <div class="sheet" id="sheet"></div>
  <div class="gl say" id="say"></div>

  <div class="gl bar">
    <button onclick="emote('hi')"><svg class="i" viewBox="0 0 24 24"><path d="M8 13V5.5a1.5 1.5 0 0 1 3 0V11M11 10V4a1.5 1.5 0 0 1 3 0v6M14 10V5.5a1.5 1.5 0 0 1 3 0V13c0 4-2.5 7-6 7-2.6 0-4-1.2-5.5-3.4L4 14c-.8-1.2.7-2.6 1.8-1.6L8 14"/></svg>인사</button>
    <button onclick="emote('hand')"><svg class="i" viewBox="0 0 24 24"><path d="M12 2v6M8 4l2 4M16 4l-2 4"/><path d="M7 13a5 5 0 0 0 10 0v-2a2 2 0 0 0-4 0M7 13v-1a2 2 0 0 1 4 0"/><path d="M9 21h6"/></svg>손들기</button>
    <button onclick="toggleSay()"><svg class="i" viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 10h8M8 13h5"/></svg>말하기</button>
    <button onclick="openWardrobe()"><svg class="i" viewBox="0 0 24 24"><path d="M8 4 4 7l2 4 2-1v10h8V10l2 1 2-4-4-3a4 4 0 0 1-8 0z"/></svg>꾸미기</button>
    <button onclick="emote('cheer')"><svg class="i" viewBox="0 0 24 24"><path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"/></svg>응원</button>
  </div>

  <div class="gl toast" id="toast"></div>
  <div class="gl hint" id="hint"><b>진로 광장에 왔어요</b>바닥을 누르면 그쪽으로 걸어가요.<br>건물 가까이 가면 이번 달 퀘스트가 열려요.<br>앞에 보이는 <b style="display:inline;font-size:14px">정문</b>으로 나가면 140개 학과가 있는 랜드예요.</div>
  <div class="modal" id="modal" onclick="if(event.target===this)closeM()"><div class="mbox" id="mbox"></div></div>
</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// 비커스 진로 로드맵에서 열 때 넘겨받는 값 (?name=김민준&room=중1 반)
const QP=new URLSearchParams(location.search),ME_NAME=QP.get('name')||'김민준',ROOM=QP.get('room')||'중1 A반';
const EMBED=window.parent!==window;
function closePlaza(){if(EMBED)window.parent.postMessage({type:'career-plaza-close'},'*');else toast('진로 로드맵으로 돌아가요')}
const $=id=>document.getElementById(id);

  const armL=new THREE.Group(),armR=new THREE.Group();armL.position.set(-.52,1.35,0);armR.position.set(.52,1.35,0);

function jump(k){const d=DEPS[k];const L=LANDS[d.s];const dx=L.cx-d.door.x,dz=L.cz-d.door.z,dd=Math.hypot(dx,dz);warp({x:d.door.x+dx/dd*1.4,z:d.door.z+dz/dd*1.4});faceTo(me,d.g);camYaw=me.rotation.y+Math.PI}
function openDex(){const n=visited.size;$('mbox').innerHTML='<div class="grab"></div><h3>학과 도장 '+n+' / 140</h3><div class="s">건물에 들어가 볼 때마다 도장이 찍혀요. 랜드마다 3곳을 둘러보면 랜드 배지를 받아요.</div><div class="dexbar"><i style="width:'+(n/1.4)+'%"></i></div>'+SER.map((s,si)=>{const tot=DEPS.filter(d=>d.s===si).length,c=landCount(si);return '<div class="dexrow"><span style="background:'+s[1]+'"></span><b>'+s[0]+'</b><div class="mini"><i style="width:'+(c/tot*100)+'%;background:'+s[1]+'"></i></div><em>'+(c>=3?'🏅 ':'')+c+'/'+tot+'</em></div>'}).join('')+
  (Object.keys(liked).filter(k=>liked[k]===0).length?'<div class="sec"><b>💚 끌린 학과</b><div class="pills">'+Object.keys(liked).filter(k=>liked[k]===0).map(k=>'<span>'+DEPS[k].n+'</span>').join('')+'</div></div>':'')+'<div class="btns"><button class="btn p" onclick="closeM()">확인</button></div>';$('modal').classList.add('on')}

/* 에버랜드식 일러스트 지도 */
function openMap(){const xs=[-30,...LANDS.map(L=>L.cx-LAND_RAD),...LANDS.map(L=>L.cx+LAND_RAD)],zs=[-25,...LANDS.map(L=>L.cz-LAND_RAD),...LANDS.map(L=>L.cz+LAND_RAD)];
  const x0=Math.min(...xs)-8,x1=Math.max(...xs)+8,z0=Math.min(...zs)-8,z1=Math.max(...zs)+8,S=Math.min(320/(x1-x0),320/(z1-z0)),W=(x1-x0)*S+20,H=(z1-z0)*S+20;
  const Pm=(x,z)=>[10+(x-x0)*S,10+(z-z0)*S];
  let svg='<svg viewBox="0 0 '+W+' '+H+'" class="pmap"><defs><radialGradient id="gg" cx="50%" cy="40%" r="70%"><stop offset="0" stop-color="#D9F2DD"/><stop offset="1" stop-color="#A9D8B0"/></radialGradient></defs><rect x="1" y="1" width="'+(W-2)+'" height="'+(H-2)+'" rx="26" fill="url(#gg)"/>';
  const line=pts=>'<polyline points="'+pts.map(p=>Pm(p[0],p[1]).join(',')).join(' ')+'" fill="none" stroke="#F3E9D2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>';
  svg+=line(AVE);ROADS.forEach(rd=>svg+=line(rd));
  for(let k=0;k<70;k++){const a=k*2.399,r=40+((k*53)%190),x=HUB.x+Math.cos(a)*r,z=HUB.z+Math.sin(a)*r;if(x<x0||x>x1||z<z0||z>z1||Math.hypot(x,z)<28||LANDS.some(L=>Math.hypot(L.cx-x,L.cz-z)<LAND_RAD+4))continue;const [px,py]=Pm(x,z);svg+='<circle cx="'+px+'" cy="'+py+'" r="3.2" fill="#6BBF84"/>'}
  let [px,py]=Pm(0,0);svg+='<g class="ml" onclick="closeM();walkRoute(plazaRoute())"><circle cx="'+px+'" cy="'+py+'" r="'+(20*S)+'" fill="#F3E9D2" stroke="#10B981" stroke-width="2"/><circle cx="'+px+'" cy="'+py+'" r="6" fill="#34D399"/><text x="'+px+'" y="'+(py+20*S+11)+'" class="mt">진로 광장</text></g>';
  [px,py]=Pm(GATE.x,GATE.z);svg+='<rect x="'+(px-7)+'" y="'+(py-3)+'" width="14" height="6" rx="2" fill="#047857"/><text x="'+(px+10)+'" y="'+(py+3)+'" class="ms" style="text-anchor:start">정문</text>';
  [px,py]=Pm(HUB.x,HUB.z);svg+='<g class="ml" onclick="closeM();walkRoute(toHub())"><circle cx="'+px+'" cy="'+py+'" r="'+(HUBR*S)+'" fill="#EFE6D2" stroke="#38BDF8" stroke-width="2"/><circle cx="'+px+'" cy="'+py+'" r="4" fill="#38BDF8"/><text x="'+px+'" y="'+(py+HUBR*S+10)+'" class="ms">갈림길 광장</text></g>';
  LANDS.forEach(L=>{const [x,y]=Pm(L.cx,L.cz),r=LAND_RAD*S;svg+='<g class="ml" onclick="mapPick('+L.si+')"><circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="'+tint(L.col,.55).getStyle()+'" stroke="'+L.col+'" stroke-width="2.5"/><circle cx="'+x+'" cy="'+(y-7)+'" r="8" fill="'+L.col+'"/><text x="'+x+'" y="'+(y-4)+'" class="mi">'+(L.si+1)+'</text><text x="'+x+'" y="'+(y+9)+'" class="mt">'+L.name+'</text><text x="'+x+'" y="'+(y+19)+'" class="ms">'+landCount(L.si)+'/'+DEPS.filter(d=>d.s===L.si).length+'</text></g>'});
  QUESTS.forEach(q=>{if(q.done)return;const [x,y]=Pm(q.x,q.z);svg+='<circle cx="'+x+'" cy="'+y+'" r="4.5" fill="#FBBF24" stroke="#fff" stroke-width="1.3"/><text x="'+x+'" y="'+(y+2.3)+'" class="mq">?</text>'});
  const [mx,my]=Pm(me.position.x,me.position.z);svg+='<circle cx="'+mx+'" cy="'+my+'" r="9" fill="#059669" opacity=".25" class="pulse"/><circle cx="'+mx+'" cy="'+my+'" r="5" fill="#059669" stroke="#fff" stroke-width="2"/></svg>';
  $('mbox').innerHTML='<div class="grab"></div><h3>학과 랜드 지도</h3><div class="s">진로 광장 정문 → 큰길 → 갈림길 광장 → 8개 랜드. 노란 <b style="color:#B45309">?</b>는 길 위 퀘스트 (남은 '+QUESTS.filter(q=>!q.done).length+'개). 장소를 누르면 그쪽으로 걸어가요.</div>'+svg+'<div id="mpick" class="s" style="text-align:center">지도에서 가고 싶은 랜드를 눌러요</div>';$('modal').classList.add('on')}
function mapPick(si){const L=LANDS[si],c=landCount(si),tot=DEPS.filter(d=>d.s===si).length;
  $('mpick').innerHTML='<div class="pk"><span style="background:'+L.col+'"></span><div><b>'+L.name+' · '+LANDMARK_NAME[si]+'</b><small>학과 '+tot+'곳 · 도장 '+c+'/'+tot+'</small></div></div><div class="btns"><button class="btn p" onclick="closeM();hideHint();walkRoute(landRoute('+si+'))">걸어가기</button><button class="btn o" onclick="warp({x:LANDS['+si+'].inW.x,z:LANDS['+si+'].inW.z});me.rotation.y=Math.atan2(LANDS['+si+'].cx-me.position.x,LANDS['+si+'].cz-me.position.z);camYaw=me.rotation.y+Math.PI">바로 가기</button></div>'}

  let moving=false;if(target){moving=!step(me,target.x,target.z,7,dt);if(!moving)nextWp();

    if(route.length&&zone==='world'){const qi=QUESTS.findIndex(q=>!q.done&&Math.hypot(q.x-me.position.x,q.z-me.position.z)<2.4);
      if(qi>=0){paused=[target,...route];target=null;route=[];$('walk').style.display='none';near='q'+qi;questSheet(qi)}}}
  walkAnim(me,moving,dt);
  // 포즈
  const u=me.userData;if(pose&&now-poseT<1600){const p=(now-poseT)/1600;if(pose==='hand'){u.armR.rotation.x=0;u.armR.rotation.z=2.7}else if(pose==='hi'){u.armR.rotation.z=2.2+Math.sin(p*20)*.4}else if(pose==='cheer'){u.armL.rotation.z=-2.5;u.armR.rotation.z=2.5;me.position.y=.3+Math.abs(Math.sin(p*Math.PI*3))*.35}}else{u.armL.rotation.z+=(0-u.armL.rotation.z)*.2;u.armR.rotation.z+=(0-u.armR.rotation.z)*.2;me.position.y=.3;pose=null}
  // 친구들
  friends.forEach((f,i)=>{if(f.wait>0){f.wait-=dt;walkAnim(f.o,false,dt);return}
    if(!f.tgt){const s=Math.random()<.35?ST[Math.floor(Math.random()*(CUR+1))]:null;const a=Math.random()*Math.PI*2,r=5+Math.random()*12;f.tgt=s?{x:s.x*.88+(Math.random()-.5)*2,z:s.z*.88+(Math.random()-.5)*2}:{x:Math.cos(a)*r,z:Math.sin(a)*r}}
    const done=step(f.o,f.tgt.x,f.tgt.z,2.4,dt);walkAnim(f.o,!done,dt);if(done){f.tgt=null;f.wait=1.5+Math.random()*4;if(Math.random()<.25&&dist(f.o)<14)bubble(f.o,FSAY[Math.floor(Math.random()*FSAY.length)],2200)}});
  walkAnim(teacher,false,dt);
  // 반짝이는 링, 잎 등장
  ST.forEach(s=>{if(s.g.userData.glow)s.g.userData.glow.material.emissiveIntensity=.6+Math.sin(now/300)*.35});
  leafs.forEach(l=>{if(l.userData.pop!=null&&l.userData.pop<1){l.userData.pop=Math.min(1,l.userData.pop+dt*1.6);const t=l.userData.pop;l.scale.setScalar(t<.7?t/.7*1.5:1.5-(t-.7)/.3*.5)}});
  tree.rotation.y+=dt*.05;
  // 카메라 (뒤에서 내려다보기)
  if(moving&&!down){let d=(me.rotation.y+Math.PI)-camYaw;d=Math.atan2(Math.sin(d),Math.cos(d));camYaw+=d*Math.min(1,dt*2.2)}
  const cx=me.position.x+Math.sin(camYaw)*13,cz=me.position.z+Math.cos(camYaw)*13,ck=1-Math.pow(.02,dt);
  cam.position.x+=(cx-cam.position.x)*ck;cam.position.z+=(cz-cam.position.z)*ck;cam.position.y=14.5;cam.lookAt(me.position.x,2.2,me.position.z);
  // 가까운 대상 카드
  if(!target){let k=null;const sNear=zone==='plaza'&&ST.find(s=>Math.hypot(s.wx-me.position.x,s.wz-me.position.z)<6.2);
    if(zone==='world'&&Math.hypot(HUB.x-me.position.x,HUB.z-me.position.z)<HUBR+1)k='hub';
    else if(zone==='world'){const di=DEPS.findIndex(d=>Math.hypot(d.door.x-me.position.x,d.door.z-me.position.z)<2.4);if(di>=0)k={dep:di};else{const qi=QUESTS.findIndex(q=>!q.done&&Math.hypot(q.x-me.position.x,q.z-me.position.z)<2.6);if(qi>=0)k={quest:qi}}}
    else if(Math.hypot(GATE.x-me.position.x,GATE.z-2-me.position.z)<3.2)k='gate';
    else if(sNear)k=sNear;else if(Math.hypot(me.position.x,me.position.z)<4.8)k='tree';else if(dist(teacher)<2.6)k='teacher';else{const f=friends.find(f=>f.o===pendFriend&&dist(f.o)<3);if(f)k={f}}
    const key=k&&(k.f?k.f.n:k.dep!=null?'d'+k.dep:k.quest!=null?'q'+k.quest:k.pg!=null?'p'+k.pg:k.name||k);if(key!==near){near=key;if(k)showSheet(k);else closeSheet()}}
  else near=null;
  // 라벨
  place(meTag,me,2.95);friends.forEach(f=>place(f.tag,f.o,2.95));place(tTag,teacher,2.95);
  worldTick(now,dt);townLabels();
  ST.forEach(s=>{if(Math.hypot(s.wx-me.position.x,s.wz-me.position.z)>40){s.tag.style.display='none';return}v3.set(s.wx,5.2,s.wz);v3.project(cam);const w=frame.clientWidth,h=frame.clientHeight;if(v3.z>1){s.tag.style.display='none'}else{s.tag.style.display='';s.tag.style.left=((v3.x+1)/2*w)+'px';s.tag.style.top=((1-v3.y)/2*h)+'px'}});
  for(let i=bubs.length-1;i>=0;i--){const b=bubs[i];if(now>b.until){b.e.remove();bubs.splice(i,1);continue}place(b.e,b.obj,3.75)}
  if(prevR&&$('modal').classList.contains('on')&&$('pv')){prevAv.rotation.y+=dt*.8;walkAnim(prevAv,false,dt);prevR.render(prevS,prevC)}
  R.render(scene,cam);requestAnimationFrame(loop)}
requestAnimationFrame(loop);
/* ===== 비커스 저장 연결 — 진로 로드맵(부모 화면)이 Supabase에 읽고 써요 ===== */
function send2(m){if(EMBED)window.parent.postMessage(m,location.origin)}
let lastProf='',loaded=!EMBED;
function profKey(){return JSON.stringify({drops:drop,equip,owned:[...owned]})}
function applyState(st){
  if(st.drops!=null){drop=st.drops;$('drop').textContent=drop}
  (st.owned||[]).forEach(id=>owned.add(id));if(st.equip)Object.assign(equip,st.equip);refreshMe();
  (st.visits||[]).forEach(v=>{const k=DEPS.findIndex(d=>d.n===v.dept_name);if(k<0)return;visited.add(k);if(v.liked!=null)liked[k]=v.liked;DEPS[k].tag.querySelector('.k').textContent='✓'});
  SER.forEach((x,si)=>{const el=$('lc'+si);if(el)el.textContent=landCount(si)+'/'+DEPS.filter(d=>d.s===si).length});
  (st.quests||[]).forEach(key=>{const q=QUESTS[+String(key).slice(1)];if(q&&!q.done){q.done=true;scene.remove(q.o)}});
  chips();lastProf=profKey()}
window.addEventListener('message',e=>{if(e.origin!==location.origin)return;const d=e.data||{};if(d.type==='plaza-state'){applyState(d.state||{});loaded=true}});
setInterval(()=>{if(!loaded)return;const k=profKey();if(k!==lastProf){lastProf=k;send2({type:'plaza-save',kind:'profile',data:JSON.parse(k)})}},1500);
send2({type:'plaza-ready'});
</script>
