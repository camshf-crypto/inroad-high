  const hr=mesh(new THREE.SphereGeometry(.66,20,16,0,Math.PI*2,0,Math.PI*.55),M(hair),0,2.02,-.03);g.add(hr);const sleeves=[];
  const eyeM=M('#2B1D14');[-.2,.2].forEach(x=>g.add(mesh(new THREE.SphereGeometry(.07,8,8),eyeM,x,1.95,.56,false)));
  [-.36,.36].forEach(x=>g.add(mesh(new THREE.SphereGeometry(.09,8,8),M('#F9A8D4',{transparent:true,opacity:.7}),x,1.78,.5,false)));
  const armL=new THREE.Group(),armR=new THREE.Group();armL.position.set(-.52,1.35,0);armR.position.set(.52,1.35,0);
  [armL,armR].forEach(a=>{const sl=mesh(new THREE.CylinderGeometry(.11,.11,.7,8),M(shirt),0,-.35,0);sleeves.push(sl);a.add(sl);a.add(mesh(new THREE.SphereGeometry(.13,8,8),skin,0,-.72,0));g.add(a)});

  legR.material=legL.material.clone();g.userData={armL,armR,legL,legR,body,sleeves,hair:hr,base:{shirt},t:Math.random()*10};(sc||scene).add(g);return g}

  $('modal').classList.add('on');
  if(first){visited.add(k);send2({type:'plaza-save',kind:'visit',data:{dept_name:d.n,series:SER[d.s][0]}});drop++;$('drop').textContent=drop;d.tag.querySelector('.k').textContent='✓';chips();treeSync();const c=landCount(d.s),tot=DEPS.filter(x=>x.s===d.s).length;$('lc'+d.s).textContent=c+'/'+tot;
    setTimeout(()=>toast(c===3?LANDS[d.s].name+' 배지 획득! (학과 3곳 방문)':d.n+' 도장 · 💧+1 · '+visited.size+'/140'),400)}}
function like(k,j){liked[k]=j;send2({type:'plaza-save',kind:'like',data:{dept_name:DEPS[k].n,series:SER[DEPS[k].s][0],liked:j}});document.querySelectorAll('.likes button').forEach((b,i)=>b.classList.toggle('on',i===j));treeSync();if($('msn'))$('msn').innerHTML=missionBox(k);if(j===0)toast('관심 학과에 담았어요 · 진로 로드맵에 쌓여요')}
function openFind(){$('mbox').innerHTML='<div class="grab"></div><h3>학과 찾기</h3><div class="s">이름을 누르면 그 건물 앞으로 바로 가요.</div><input class="fin" id="fin" placeholder="예) 간호, 컴퓨터, 디자인" oninput="findList()"><div id="flist"></div>';$('modal').classList.add('on');findList()}
function findList(){const q=($('fin')||{}).value||'';$('flist').innerHTML=SER.map((s,si)=>{const L=DEPS.map((d,k)=>[d,k]).filter(([d])=>d.s===si&&d.n.includes(q.trim()));if(!L.length)return '';return '<div class="fg"><b><span style="background:'+s[1]+'"></span>'+LANDS[si].name+'</b><div>'+L.map(([d,k])=>'<button onclick="jump('+k+')">'+(visited.has(k)?'✓ ':'')+d.n.replace(/학과$|과$/,'')+'</button>').join('')+'</div></div>'}).join('')||'<div class="s" style="margin-top:12px">찾는 학과가 없어요</div>'}
function jump(k){const d=DEPS[k];const L=LANDS[d.s];const dx=L.cx-d.door.x,dz=L.cz-d.door.z,dd=Math.hypot(dx,dz);warp({x:d.door.x+dx/dd*1.4,z:d.door.z+dz/dd*1.4});faceTo(me,d.g);camYaw=me.rotation.y+Math.PI}
function openDex(){const n=visited.size;$('mbox').innerHTML='<div class="grab"></div><h3>학과 도장 '+n+' / 140</h3><div class="s">건물에 들어가 볼 때마다 도장이 찍혀요. 랜드마다 3곳을 둘러보면 랜드 배지를 받아요.</div><div class="dexbar"><i style="width:'+(n/1.4)+'%"></i></div>'+SER.map((s,si)=>{const tot=DEPS.filter(d=>d.s===si).length,c=landCount(si);return '<div class="dexrow"><span style="background:'+s[1]+'"></span><b>'+s[0]+'</b><div class="mini"><i style="width:'+(c/tot*100)+'%;background:'+s[1]+'"></i></div><em>'+(c>=3?'🏅 ':'')+c+'/'+tot+'</em></div>'}).join('')+
  (Object.keys(liked).filter(k=>liked[k]===0).length?'<div class="sec"><b>💚 끌린 학과</b><div class="pills">'+Object.keys(liked).filter(k=>liked[k]===0).map(k=>'<span>'+DEPS[k].n+'</span>').join('')+'</div></div>':'')+'<div class="btns"><button class="btn p" onclick="closeM()">확인</button></div>';$('modal').classList.add('on')}

function openMap(){const xs=[-30,...LANDS.map(L=>L.cx-LAND_RAD),...LANDS.map(L=>L.cx+LAND_RAD)],zs=[-25,...LANDS.map(L=>L.cz-LAND_RAD),...LANDS.map(L=>L.cz+LAND_RAD)];
  const x0=Math.min(...xs)-8,x1=Math.max(...xs)+8,z0=Math.min(...zs)-8,z1=Math.max(...zs)+8,S=Math.min(320/(x1-x0),320/(z1-z0)),W=(x1-x0)*S+20,H=(z1-z0)*S+20;
  const Pm=(x,z)=>[10+(x-x0)*S,10+(z-z0)*S];
  let svg='<svg viewBox="0 0 '+W+' '+H+'" class="pmap"><defs><radialGradient id="gg" cx="50%" cy="40%" r="70%"><stop offset="0" stop-color="#D9F2DD"/><stop offset="1" stop-color="#A9D8B0"/></radialGradient></defs><rect x="1" y="1" width="'+(W-2)+'" height="'+(H-2)+'" rx="26" fill="url(#gg)"/>';
  const line=pts=>'<polyline points="'+pts.map(p=>Pm(p[0],p[1]).join(',')).join(' ')+'" fill="none" stroke="#F3E9D2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>';
  svg+=line(AVE);ROADS.forEach(rd=>svg+=line(rd));
  for(let k=0;k<70;k++){const a=k*2.399,r=40+((k*53)%190),x=HUB.x+Math.cos(a)*r,z=HUB.z+Math.sin(a)*r;if(x<x0||x>x1||z<z0||z>z1||Math.hypot(x,z)<28||LANDS.some(L=>Math.hypot(L.cx-x,L.cz-z)<LAND_RAD+4))continue;const [px,py]=Pm(x,z);svg+='<circle cx="'+px+'" cy="'+py+'" r="3.2" fill="#6BBF84"/>'}
  let [px,py]=Pm(0,0);svg+='<g class="ml" onclick="closeM();walkRoute(plazaRoute())"><circle cx="'+px+'" cy="'+py+'" r="'+(20*S)+'" fill="#F3E9D2" stroke="#10B981" stroke-width="2"/><circle cx="'+px+'" cy="'+py+'" r="6" fill="#34D399"/><text x="'+px+'" y="'+(py+20*S+11)+'" class="mt">진로 광장</text></g>';
  [px,py]=Pm(GATE.x,GATE.z);svg+='<rect x="'+(px-7)+'" y="'+(py-3)+'" width="14" height="6" rx="2" fill="#047857"/><text x="'+(px+10)+'" y="'+(py+3)+'" class="ms" style="text-anchor:start">정문</text>';
  [px,py]=Pm(HUB.x,HUB.z);svg+='<g class="ml" onclick="closeM();walkRoute(toHub())"><circle cx="'+px+'" cy="'+py+'" r="'+(HUBR*S)+'" fill="#EFE6D2" stroke="#38BDF8" stroke-width="2"/><circle cx="'+px+'" cy="'+py+'" r="4" fill="#38BDF8"/><text x="'+px+'" y="'+(py+HUBR*S+10)+'" class="ms">갈림길 광장</text></g>';
  LANDS.forEach(L=>{const [x,y]=Pm(L.cx,L.cz),r=LAND_RAD*S;svg+='<g class="ml" onclick="mapPick('+L.si+')"><circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="'+tint(L.col,.55).getStyle()+'" stroke="'+L.col+'" stroke-width="2.5"/><circle cx="'+x+'" cy="'+(y-7)+'" r="8" fill="'+L.col+'"/><text x="'+x+'" y="'+(y-4)+'" class="mi">'+(L.si+1)+'</text><text x="'+x+'" y="'+(y+9)+'" class="mt">'+L.name+'</text><text x="'+x+'" y="'+(y+19)+'" class="ms">'+landCount(L.si)+'/'+DEPS.filter(d=>d.s===L.si).length+'</text></g>'});
  QUESTS.forEach(q=>{if(q.done)return;const [x,y]=Pm(q.x,q.z);svg+='<circle cx="'+x+'" cy="'+y+'" r="4.5" fill="#FBBF24" stroke="#fff" stroke-width="1.3"/><text x="'+x+'" y="'+(y+2.3)+'" class="mq">?</text>'});
  const [mx,my]=Pm(me.position.x,me.position.z);svg+='<circle cx="'+mx+'" cy="'+my+'" r="9" fill="#059669" opacity=".25" class="pulse"/><circle cx="'+mx+'" cy="'+my+'" r="5" fill="#059669" stroke="#fff" stroke-width="2"/></svg>';
  $('mbox').innerHTML='<div class="grab"></div><h3>학과 랜드 지도</h3><div class="s">진로 광장 정문 → 큰길 → 갈림길 광장 → 8개 랜드. 노란 <b style="color:#B45309">?</b>는 길 위 퀘스트 (지금 '+QUESTS.filter(q=>!q.done).length+'개 · 푼 자리는 다시 다녀오면 새 문제로 생겨요). 장소를 누르면 그쪽으로 걸어가요.</div>'+svg+'<div id="mpick" class="s" style="text-align:center">지도에서 가고 싶은 랜드를 눌러요</div>';$('modal').classList.add('on')}
function mapPick(si){const L=LANDS[si],c=landCount(si),tot=DEPS.filter(d=>d.s===si).length;
  $('mpick').innerHTML='<div class="pk"><span style="background:'+L.col+'"></span><div><b>'+L.name+' · '+LANDMARK_NAME[si]+'</b><small>학과 '+tot+'곳 · 도장 '+c+'/'+tot+'</small></div></div><div class="btns"><button class="btn p" onclick="closeM();hideHint();walkRoute(landRoute('+si+'))">걸어가기</button><button class="btn o" onclick="warp({x:LANDS['+si+'].inW.x,z:LANDS['+si+'].inW.z});me.rotation.y=Math.atan2(LANDS['+si+'].cx-me.position.x,LANDS['+si+'].cz-me.position.z);camYaw=me.rotation.y+Math.PI">바로 가기</button></div>'}

let last=performance.now();
function walkAnim(o,moving,dt){const u=o.userData;u.t+=dt*(moving?9:2);const s=moving?Math.sin(u.t)*.55:0;
  u.legL.rotation.x=s;u.legR.rotation.x=-s;u.armL.rotation.x=-s*.8;u.armR.rotation.x=s*.8;u.body.position.y=.95+(moving?Math.abs(Math.sin(u.t))*.06:Math.sin(u.t)*.015)}
function step(o,tx,tz,speed,dt){const dx=tx-o.position.x,dz=tz-o.position.z,d=Math.hypot(dx,dz);if(d<.08)return true;const k=Math.min(d,speed*dt)/d;o.position.x+=dx*k;o.position.z+=dz*k;
  const want=Math.atan2(dx,dz);let diff=want-o.rotation.y;diff=Math.atan2(Math.sin(diff),Math.cos(diff));o.rotation.y+=diff*Math.min(1,dt*10);return false}
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;
  // 나
  let moving=false;if(target){moving=!step(me,target.x,target.z,7,dt);if(!moving)nextWp();
    // 길을 가다 퀘스트 보석을 만나면 멈춰서 풀기
    if(route.length&&zone==='world'){const qi=QUESTS.findIndex(q=>!q.done&&Math.hypot(q.x-me.position.x,q.z-me.position.z)<2.4);
      if(qi>=0){paused=[target,...route];target=null;route=[];$('walk').style.display='none';near='q'+qi;questSheet(qi)}}}
  walkAnim(me,moving,dt);
  // 포즈
  const u=me.userData;if(pose&&now-poseT<1600){const p=(now-poseT)/1600;if(pose==='hand'){u.armR.rotation.x=0;u.armR.rotation.z=2.7}else if(pose==='hi'){u.armR.rotation.z=2.2+Math.sin(p*20)*.4}else if(pose==='cheer'){u.armL.rotation.z=-2.5;u.armR.rotation.z=2.5;me.position.y=.3+Math.abs(Math.sin(p*Math.PI*3))*.35}}else{u.armL.rotation.z+=(0-u.armL.rotation.z)*.2;u.armR.rotation.z+=(0-u.armR.rotation.z)*.2;me.position.y=.3;pose=null}
  // 친구들
  friends.forEach((f,i)=>{if(f.wait>0){f.wait-=dt;walkAnim(f.o,false,dt);return}
    if(!f.tgt){const s=Math.random()<.35?ST[Math.floor(Math.random()*(CUR+1))]:null;const a=Math.random()*Math.PI*2,r=5+Math.random()*12;f.tgt=s?{x:s.x*.88+(Math.random()-.5)*2,z:s.z*.88+(Math.random()-.5)*2}:{x:Math.cos(a)*r,z:Math.sin(a)*r}}
    const done=step(f.o,f.tgt.x,f.tgt.z,2.4,dt);walkAnim(f.o,!done,dt);if(done){f.tgt=null;f.wait=1.5+Math.random()*4;if(Math.random()<.25&&dist(f.o)<14)bubble(f.o,FSAY[Math.floor(Math.random()*FSAY.length)],2200)}});
  walkAnim(teacher,false,dt);
  // 반짝이는 링, 잎 등장
  ST.forEach(s=>{if(s.g.userData.glow)s.g.userData.glow.material.emissiveIntensity=.6+Math.sin(now/300)*.35});
  leafs.forEach(l=>{if(l.userData.pop!=null&&l.userData.pop<1){l.userData.pop=Math.min(1,l.userData.pop+dt*1.6);const t=l.userData.pop;l.scale.setScalar(t<.7?t/.7*1.5:1.5-(t-.7)/.3*.5)}});
  tree.rotation.y+=dt*.05;
  // 카메라 (뒤에서 내려다보기)
  if(moving&&!down){let d=(me.rotation.y+Math.PI)-camYaw;d=Math.atan2(Math.sin(d),Math.cos(d));camYaw+=d*Math.min(1,dt*2.2)}
  const cx=me.position.x+Math.sin(camYaw)*13,cz=me.position.z+Math.cos(camYaw)*13,ck=1-Math.pow(.02,dt);
  cam.position.x+=(cx-cam.position.x)*ck;cam.position.z+=(cz-cam.position.z)*ck;cam.position.y=14.5;cam.lookAt(me.position.x,2.2,me.position.z);
  // 가까운 대상 카드
  if(!target){let k=null;const sNear=zone==='plaza'&&ST.find(s=>Math.hypot(s.wx-me.position.x,s.wz-me.position.z)<6.2);
    if(zone==='world'&&Math.hypot(HUB.x-me.position.x,HUB.z-me.position.z)<HUBR+1)k='hub';
    else if(zone==='world'){const di=DEPS.findIndex(d=>Math.hypot(d.door.x-me.position.x,d.door.z-me.position.z)<2.4);if(di>=0)k={dep:di};else{const qi=QUESTS.findIndex(q=>!q.done&&Math.hypot(q.x-me.position.x,q.z-me.position.z)<2.6);if(qi>=0)k={quest:qi}}}
    else if(Math.hypot(GATE.x-me.position.x,GATE.z-2-me.position.z)<3.2)k='gate';
    else if(sNear)k=sNear;else if(Math.hypot(me.position.x,me.position.z)<4.8)k='tree';else if(dist(teacher)<2.6)k='teacher';else{const f=friends.find(f=>f.o===pendFriend&&dist(f.o)<3);if(f)k={f}}
    const key=k&&(k.f?k.f.n:k.dep!=null?'d'+k.dep:k.quest!=null?'q'+k.quest:k.pg!=null?'p'+k.pg:k.name||k);if(key!==near){near=key;if(k)showSheet(k);else closeSheet()}}
  else near=null;
  // 라벨
  place(meTag,me,2.95);friends.forEach(f=>place(f.tag,f.o,2.95));place(tTag,teacher,2.95);
  worldTick(now,dt);townLabels();
  ST.forEach(s=>{if(Math.hypot(s.wx-me.position.x,s.wz-me.position.z)>40){s.tag.style.display='none';return}v3.set(s.wx,5.2,s.wz);v3.project(cam);const w=frame.clientWidth,h=frame.clientHeight;if(v3.z>1){s.tag.style.display='none'}else{s.tag.style.display='';s.tag.style.left=((v3.x+1)/2*w)+'px';s.tag.style.top=((1-v3.y)/2*h)+'px'}});
  for(let i=bubs.length-1;i>=0;i--){const b=bubs[i];if(now>b.until){b.e.remove();bubs.splice(i,1);continue}place(b.e,b.obj,3.75)}
  if(prevR&&$('modal').classList.contains('on')&&$('pv')){prevAv.rotation.y+=dt*.8;walkAnim(prevAv,false,dt);prevR.render(prevS,prevC)}
  R.render(scene,cam);requestAnimationFrame(loop)}
requestAnimationFrame(loop);
/* ===== 비커스 저장 연결 — 진로 로드맵(부모 화면)이 Supabase에 읽고 써요 ===== */
function send2(m){if(EMBED)window.parent.postMessage(m,location.origin)}
let lastProf='',loaded=!EMBED;treeSync();
function profKey(){return JSON.stringify({drops:drop,equip,owned:[...owned]})}
function applyState(st){
  if(st.drops!=null){drop=st.drops;$('drop').textContent=drop}
  (st.owned||[]).forEach(id=>owned.add(id));if(st.equip)Object.assign(equip,st.equip);refreshMe();
  (st.visits||[]).forEach(v=>{const k=DEPS.findIndex(d=>d.n===v.dept_name);if(k<0)return;visited.add(k);if(v.liked!=null)liked[k]=v.liked;DEPS[k].tag.querySelector('.k').textContent='✓'});
  SER.forEach((x,si)=>{const el=$('lc'+si);if(el)el.textContent=landCount(si)+'/'+DEPS.filter(d=>d.s===si).length});
  (st.quests||[]).forEach(key=>{key=String(key);if(key.startsWith('b:')){badges.add(key.slice(2));return}qDone.add(key);qTotal++;
    if(key.startsWith('d:')){dquiz.add(key.slice(2));return}
    let qi,rd;if(/^q\d+$/.test(key)){qi=+key.slice(1);rd=0}else{const a=key.split(':');qi=+a[1];rd=+a[2];if(a[0]==='p'&&a[3]!=null)pTally[+a[3]]++}
    const q=QUESTS[qi];if(q)q.round=Math.max(q.round,rd+1)});
  // 마지막에 푼 문제는 바로 다시 안 나오게: 처음엔 모두 보이고, 다음 회차 문제로
  QUESTS.forEach(q=>{q.done=false;q.o.visible=true;const c=QTYPE_COL[qLevel()];q.gem.material=M(c,{emissive:c,emissiveIntensity:.5,flatShading:true})});
  (st.missions||[]).forEach(m=>{if(!m.grade||!m.month||!MK[m.kind])return;const key=m.grade+'|'+m.month+'|'+m.kind;if(!MS[key])qTotal++;MS[key]=m});
  treeSync();chips();lastProf=profKey()}
window.addEventListener('message',e=>{if(e.origin!==location.origin)return;const d=e.data||{};if(d.type==='plaza-state'){applyState(d.state||{});loaded=true}});
setInterval(()=>{if(!loaded)return;const k=profKey();if(k!==lastProf){lastProf=k;send2({type:'plaza-save',kind:'profile',data:JSON.parse(k)})}},1500);
send2({type:'plaza-ready'});
</script>
